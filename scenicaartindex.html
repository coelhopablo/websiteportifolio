  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "DynaPuff", cursive;
      background-color: black;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .gallery {
      flex-wrap: nowrap;
      overflow-y: scroll;
      margin-top: 20px;
      max-height: 400px;
    }
    .gallery::-webkit-scrollbar {
      display: none;
    }

    .photo {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 10px;
      transition: transform 0.3s;
      overflow: hidden;
    }

    .photo:hover {
      transform: scale(1.2);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .fullscreen img {
      max-width: 100%;
      max-height: 100%;
    }

    .exit-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      color: white;
      font-size: 20px;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background-color: black;
      padding: 10px;
    }

    @media screen and (min-width: 700px) {
      .gallery {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
      }
    }

    a {
      text-decoration: none;
      color: white;
    }
  </style>

    <script>
      var currentIndex = 0;

      function openFullscreen(imageSrc, index) {
        currentIndex = index;
        document.getElementById("fullscreen-img").src = imageSrc;
        document.getElementById("fullscreen").style.display = "flex";
      }

      function closeFullscreen() {
        document.getElementById("fullscreen").style.display = "none";
      }

      function navigateGallery(direction) {
        currentIndex += direction;
        var photos = document.querySelectorAll(".photo img");
        if (currentIndex < 0) {
          currentIndex = photos.length - 1;
        } else if (currentIndex >= photos.length) {
          currentIndex = 0;
        }
        openFullscreen(photos[currentIndex].src, currentIndex);
      }
    </script>
