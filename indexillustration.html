<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="refresh"
      content="0; url=./index.html#gallery/illustration"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "DynaPuff", cursive;
      background-color: black;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .gallery {
      flex-wrap: nowrap;
      overflow-y: scroll;
      margin-top: 20px;
      max-height: 400px;
    }
    .gallery::-webkit-scrollbar {
      display: none;
    }

    .photo {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 10px;
      transition: transform 0.3s;
      overflow: hidden;
    }

    .photo:hover {
      transform: scale(1.2);
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    .fullscreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2;
    }

    .fullscreen img {
      max-width: 100%;
      max-height: 100%;
    }

    .exit-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      cursor: pointer;
      color: white;
      font-size: 20px;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      background-color: black;
      padding: 10px;
    }
    img {
      image-rendering: pixelated;
    }

    @media screen and (min-width: 700px) {
      .gallery {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
      }
    }

    a {
      text-decoration: none;
      color: white;
    }
  </style>
  <header>
    <h4>
      <a href="./index.html#gallery/illustration">Open Illustration gallery</a>
    </h4>
  </header>
  <body>
    <div class="gallery">
      <div
        class="photo"
        onclick="openFullscreen('./illustration/illustration 1.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (1).jpg"
            alt="Illustration 1"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('./illustration/illustration 2.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (2).jpg"
            alt="Illustration 2"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('./illustration/illustration 3.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (3).jpg"
            alt="Illustration 3"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('./illustration/illustration 4.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (4).jpg"
            alt="Illustration 4"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('./illustration/illustration 5.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (5).jpg"
            alt="Illustration 5"
        /></a>
      </div>

      <div class="photo" onclick="openFullscreen('./illustration/10.jpg')">
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (16).jpg"
            alt="Illustration 6"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('./illustration/1600992_832567650103162_1660306313_n.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (17).jpg"
            alt="Illustration 7"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('./illustration/sketch 1.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (11).jpg"
            alt="Illustration 8"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('./illustration/sketch 2.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (12).jpg"
            alt="Illustration 9"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('../illustration/sketch 3.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (13).jpg"
            alt="Illustration 10"
        /></a>
      </div>
      <div
        class="photo"
        onclick="openFullscreen('./illustration/sketch 4.jpg')"
      >
        <a
          ><img
            src="./illustrationthumbs/illustrationthumb (14).jpg"
            alt="Illustration 11"
        /></a>
      </div>
    </div>

    <div class="fullscreen" id="fullscreen">
      <span class="exit-btn" onclick="closeFullscreen()">X</span>
      <img id="fullscreen-img" src="" alt="Fullscreen Image" />
    </div>

    <footer>
      <p>Portifolium Pablo Coelho 2024</p>
    </footer>

    <script>
      var currentIndex = 0;

      function openFullscreen(imageSrc, index) {
        currentIndex = index;
        document.getElementById("fullscreen-img").src = imageSrc;
        document.getElementById("fullscreen").style.display = "flex";
      }

      function closeFullscreen() {
        document.getElementById("fullscreen").style.display = "none";
      }

      function navigateGallery(direction) {
        currentIndex += direction;
        var photos = document.querySelectorAll(".photo img");
        if (currentIndex < 0) {
          currentIndex = photos.length - 1;
        } else if (currentIndex >= photos.length) {
          currentIndex = 0;
        }
        openFullscreen(photos[currentIndex].src, currentIndex);
      }
    </script>
  </body>
</html>
